name: Build unsigned iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iPhone
        run: |
          xcodebuild -project ZipDock.xcodeproj -scheme ZipDock -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Package IPA
        run: |
          mkdir -p "$RUNNER_TEMP/package/Payload" dist
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ZipDock.app" "$RUNNER_TEMP/package/Payload/"
          cd "$RUNNER_TEMP/package"
          zip -qry "$GITHUB_WORKSPACE/dist/ZipDock-unsigned.ipa" Payload
          unzip -t "$GITHUB_WORKSPACE/dist/ZipDock-unsigned.ipa"
          plutil -p Payload/ZipDock.app/Info.plist
          file Payload/ZipDock.app/ZipDock
      - uses: actions/upload-artifact@v4
        with:
          name: ZipDock-iOS-IPA
          path: dist/ZipDock-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
